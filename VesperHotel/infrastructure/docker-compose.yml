name: vesper

x-application-environment: &application-environment
  ASPNETCORE_ENVIRONMENT: Development
  DOTNET_ENVIRONMENT: Development
  Database__Provider: MySql
  ConnectionStrings__HotelDatabase: "Server=mysql;Port=3306;Database=${MYSQL_DATABASE:-vesper};User=${MYSQL_USER:-vesper};Password=${MYSQL_PASSWORD:?Run scripts/initialize-env.ps1};"
  Jwt__Key: ${JWT_KEY:?Run scripts/initialize-env.ps1}
  Jwt__Issuer: VesperHotel
  Jwt__Audience: VesperHotel.Web
  Seed__AdminEmail: ${ADMIN_EMAIL:-admin@vesper.local}
  Seed__AdminPassword: ${ADMIN_PASSWORD:?Run scripts/initialize-env.ps1}
  Messaging__Mode: Kafka
  Kafka__BootstrapServers: kafka:9092
  Kafka__Topic: vesper.bookings
  Elasticsearch__Url: http://elasticsearch:9200
  Frontend__Url: http://localhost:${WEB_PORT:-8080}
  Weather__BaseUrl: https://api.open-meteo.com
  Notifications__Directory: /app/data/notifications
  DataProtection__Directory: /app/data/keys
  Workers__RunInApi: "false"

services:
  mysql:
    image: mysql:8.4.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vesper}
      MYSQL_USER: ${MYSQL_USER:-vesper}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run scripts/initialize-env.ps1}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run scripts/initialize-env.ps1}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --host=127.0.0.1 --user="$$MYSQL_USER" --database="$$MYSQL_DATABASE" --execute="SELECT 1" > /dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  kafka:
    image: apache/kafka:4.1.2
    hostname: kafka
    restart: unless-stopped
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?Run scripts/initialize-env.ps1}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9094}:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [CMD, /opt/kafka/bin/kafka-topics.sh, --bootstrap-server, localhost:9092, --list]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.23
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    mem_limit: 1g
    ports:
      - "127.0.0.1:${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: [CMD-SHELL, 'curl --fail --silent "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s" > /dev/null']
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.23
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      XPACK_SECURITY_ENABLED: "false"
      TELEMETRY_ENABLED: "false"
    ports:
      - "127.0.0.1:${KIBANA_PORT:-5601}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'curl --fail --silent http://localhost:5601/api/status > /dev/null']
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s

  api:
    build:
      context: ..
      dockerfile: infrastructure/docker/api.Dockerfile
    restart: unless-stopped
    environment:
      <<: *application-environment
      ASPNETCORE_URLS: http://+:5080
    ports:
      - "127.0.0.1:${API_PORT:-5080}:5080"
    volumes:
      - application-data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:5080/api/health]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  worker:
    build:
      context: ..
      dockerfile: infrastructure/docker/worker.Dockerfile
    restart: unless-stopped
    environment:
      <<: *application-environment
    volumes:
      - application-data:/app/data
    depends_on:
      api:
        condition: service_healthy
      kafka:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: infrastructure/docker/web.Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1:8080/healthz]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
  kafka-data:
  elasticsearch-data:
  application-data:
